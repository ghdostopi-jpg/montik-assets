<title>MicroInfusion Caption Styles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-shaped live player, scene index beside it (stacks under it on phones) */
:root { --bg: #121014; --panel: #1c181b; --line: #352b2e; --fg: #F6EFE4; --muted: #b3a49d; --green: #E9A98D; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, sans-serif; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@font-face { font-family: "IBM Plex Sans"; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "IBM Plex Sans"; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
header { max-width: 980px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
h1 b { color: var(--green); font-weight: 600; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.stage { width: min(100%, calc((100vh - 120px) * 9 / 16), 430px); aspect-ratio: 9 / 16; max-width: 100%; background: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.scenes { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 1 260px; }
.scenes button { display: flex; gap: 12px; align-items: center; text-align: left; font: 500 15px/1.2 "IBM Plex Sans", system-ui, sans-serif; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.scenes button:hover { border-color: var(--muted); }
.scenes button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.scenes button.on { border-color: var(--green); background: #2a1d1a; }
.scenes .n { font-variant-numeric: tabular-nums; color: var(--green); font-weight: 600; font-size: 13px; }
@media (max-width: 720px) { .scenes { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; } .scenes button { flex: 1 1 140px; } }
</style>
<header>
  <h1><b>MicroInfusion</b> caption styles</h1>
  <p>Real transcript timings over stills of the moment. Silent preview: the final check uses the moving video and her voice.</p>
</header>
<div id="root"></div>
<script>window.remotion_staticBase = ".";</script>
<script src="app.js"></script>
